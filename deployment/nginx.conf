# Momento AI File-Processing Agent - Nginx Reverse Proxy Configuration
# Place this file in /etc/nginx/sites-available/momento
# and symlink to /etc/nginx/sites-enabled/momento

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Replace with your domain or VPS IP

    client_max_body_size 50M; # Allow large document uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long AI generation runs
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
    }
}
